name: CI

on:
  push:
    branches: [main, development, 'feature-code*']
  pull_request:
    branches: [main, development, 'feature-code*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm test